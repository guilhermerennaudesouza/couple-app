name: Build and Release APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Copy Release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk CoupleApp-Release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoupleApp-Release
          path: CoupleApp-Release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CoupleApp-Release.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
