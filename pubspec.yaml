name: couple_app
description: "A private, unmetered Flutter couples application backed by Firebase Spark tier."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase SDKs (Free Spark Tier)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.3.2

  # Notifications & Android Widgets
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  home_widget: ^0.7.0

  # Storage, Biometrics & Cryptography
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  cryptography: ^2.7.0

  # Utilities & Animations
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  ota_update: ^7.1.0
  package_info_plus: ^9.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
